services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 12

  traefik:
    image: traefik:v3
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:4208"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:4443"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
    ports:
      - "4208:4208"
      - "4443:4443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./docker/certs:/certs:ro
    networks:
      - app

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
    volumes:
      - otel-lgtm-data:/otel-lgtm
      - ./docker/grafana/dashboards-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./docker/grafana/heroes-powers-benchmark.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/heroes-powers-benchmark.json:ro
    networks:
      - app

  nest-api:
    build:
      context: ./NestApi
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: mysql://heroes_app:heroes_app@mysql:3306/nest_api
      JSON_SEED_DATA_PATH: /app/.data
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_SERVICE_NAME: nest-api
    volumes:
      - nest-data:/app/.data
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nest-api.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/openapi`)"
      - "traefik.http.routers.nest-api.entrypoints=websecure"
      - "traefik.http.routers.nest-api.tls=true"
      - "traefik.http.routers.nest-api.priority=10"
      - "traefik.http.services.nest-api.loadbalancer.server.port=3000"

  rust-api:
    build:
      context: ./RustApi
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: mysql://heroes_app:heroes_app@mysql:3306/rust_api
      JSON_SEED_ENABLED: "true"
      JSON_SEED_DATA_PATH: /app/.data
      RUST_LOG: rust_api=info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_SERVICE_NAME: rust-api
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rust-api.rule=PathPrefix(`/rust-api`)"
      - "traefik.http.routers.rust-api.entrypoints=websecure"
      - "traefik.http.routers.rust-api.tls=true"
      - "traefik.http.routers.rust-api.priority=10"
      - "traefik.http.middlewares.rust-strip.stripprefix.prefixes=/rust-api"
      - "traefik.http.routers.rust-api.middlewares=rust-strip"
      - "traefik.http.services.rust-api.loadbalancer.server.port=3000"

  sample-api:
    build:
      context: ./DotnetApi
      dockerfile: SampleApi/Dockerfile
    environment:
      ConnectionStrings__SampleApiDatabase: Server=mysql;Port=3306;Database=sample_api;User=heroes_app;Password=heroes_app;
      JsonSeed__DataPath: /data
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      OTEL_SERVICE_NAME: sample-api
    volumes:
      - sample-data:/data
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sample-api.rule=PathPrefix(`/sample-api`)"
      - "traefik.http.routers.sample-api.entrypoints=websecure"
      - "traefik.http.routers.sample-api.tls=true"
      - "traefik.http.routers.sample-api.priority=10"
      - "traefik.http.middlewares.sample-strip.stripprefix.prefixes=/sample-api"
      - "traefik.http.routers.sample-api.middlewares=sample-strip"
      - "traefik.http.services.sample-api.loadbalancer.server.port=5025"

  frontend:
    build:
      context: ./sample-front
      dockerfile: Dockerfile
    networks:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  app:

volumes:
  mysql-data:
  nest-data:
  sample-data:
  otel-lgtm-data:
