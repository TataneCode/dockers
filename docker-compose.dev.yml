services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 12

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/otelcol/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - app
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./docker/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - app

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - app
    depends_on:
      - tempo
      - loki

  nest-api:
    build:
      context: ./NestApi
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mysql://heroes_app:heroes_app@mysql:3306/nest_api
      JSON_SEED_DATA_PATH: /app/.data
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      OTEL_SERVICE_NAME: nest-api
    volumes:
      - nest-data:/app/.data
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy

  rust-api:
    build:
      context: ./RustApi
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      DATABASE_URL: mysql://heroes_app:heroes_app@mysql:3306/rust_api
      JSON_SEED_ENABLED: "true"
      JSON_SEED_DATA_PATH: /app/.data
      RUST_LOG: rust_api=info
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      OTEL_SERVICE_NAME: rust-api
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy

  sample-api:
    build:
      context: ./DotnetApi
      dockerfile: SampleApi/Dockerfile.dev
    ports:
      - "5025:5025"
    environment:
      ConnectionStrings__SampleApiDatabase: Server=mysql;Port=3306;Database=sample_api;User=heroes_app;Password=heroes_app;
      JsonSeed__DataPath: /data
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      OTEL_SERVICE_NAME: sample-api
    volumes:
      - ./DotnetApi/SampleApi/.data:/data
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy

networks:
  app:

volumes:
  mysql-data:
  nest-data:
  tempo-data:
  loki-data:
  grafana-data:
