name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      nest: ${{ steps.filter.outputs.nest }}
      rust: ${{ steps.filter.outputs.rust }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Filter paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nest:
              - 'NestApi/**'
            rust:
              - 'RustApi/**'
            dotnet:
              - 'DotnetApi/**'
            front:
              - 'sample-front/**'
            workflow:
              - '.github/workflows/tests.yml'

  nest-api:
    name: NestApi
    needs: changes
    if: ${{ needs.changes.outputs.nest == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NestApi/package-lock.json

      - name: Install dependencies
        working-directory: NestApi
        run: npm ci

      - name: Run tests
        working-directory: NestApi
        run: npm test

  rust-api:
    name: RustApi
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustApi

      - name: Run tests
        working-directory: RustApi
        run: cargo test

  dotnet-api:
    name: DotnetApi
    needs: changes
    if: ${{ needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DotnetApi/sample-back.slnx

      - name: Run tests
        run: dotnet test DotnetApi/sample-back.slnx --no-restore --verbosity normal

  front-office:
    name: Front office
    needs: changes
    if: ${{ needs.changes.outputs.front == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sample-front/package-lock.json

      - name: Install dependencies
        working-directory: sample-front
        run: npm ci

      - name: Build
        working-directory: sample-front
        run: npm run build

      - name: Run tests
        working-directory: sample-front
        run: npm test
