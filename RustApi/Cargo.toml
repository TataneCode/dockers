[package]
name = "rust-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework
axum = { version = "0.8", features = ["macros"] }

# Database
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "macros", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

async-trait = "0.1"

# Error handling
thiserror = "2"

# Config / env
dotenvy = "0.15"

# Logging & tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace", "logs"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace", "logs"] }
opentelemetry-appender-tracing = { version = "0.27" }
tracing-opentelemetry = "0.28"
tonic = "0.12"
rand = "0.8"
anyhow = "1.0.102"

[dev-dependencies]
mockall = "0.13"
tokio = { version = "1", features = ["full"] }
